name: Build Falcon Bug APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Create Android project files
        run: |
          mkdir -p falcon-app && cd falcon-app
          mkdir -p app app/src/main app/src/main/java/com/example/mtabug app/src/main/res/drawable app/src/main/res/values

          cat > settings.gradle.kts << 'EOF_FALCON_0'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "MtaBugReport"
          include(":app")
          EOF_FALCON_0

          cat > build.gradle.kts << 'EOF_FALCON_1'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "2.0.20" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.20" apply false
          }
          EOF_FALCON_1

          cat > gradle.properties << 'EOF_FALCON_2'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF_FALCON_2

          cat > app/build.gradle.kts << 'EOF_FALCON_3'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }
          android {
              namespace = "com.example.mtabug"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.mtabug"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              buildFeatures { compose = true }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation(platform("androidx.compose:compose-bom:2024.09.00"))
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.activity:activity-compose:1.9.2")
          }
          EOF_FALCON_3

          cat > app/src/main/AndroidManifest.xml << 'EOF_FALCON_4'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:label="باگ سرور فالکن"
                  android:icon="@drawable/ic_launcher"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.Falcon">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF_FALCON_4

          cat > app/src/main/res/values/themes.xml << 'EOF_FALCON_5'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.Falcon" parent="android:Theme.Material.NoActionBar">
                  <item name="android:statusBarColor">#0C0806</item>
                  <item name="android:navigationBarColor">#0C0806</item>
                  <item name="android:windowBackground">#0C0806</item>
              </style>
          </resources>
          EOF_FALCON_5

          cat > app/src/main/res/drawable/ic_launcher.xml << 'EOF_FALCON_6'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="96dp" android:height="96dp"
              android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FF6A1F"
                  android:pathData="M6,1h12a5,5 0 0 1 5,5v12a5,5 0 0 1 -5,5H6a5,5 0 0 1 -5,-5V6a5,5 0 0 1 5,-5z"/>
              <group android:pivotX="12" android:pivotY="12" android:scaleX="0.62" android:scaleY="0.62" android:translateY="0.5">
                  <path android:fillColor="#1A0A02"
                      android:pathData="M2,9c4,0 7,1.5 10,6 3,-4.5 6,-6 10,-6 -2,4 -4,6 -6.5,7L12,22l-3.5,-6C6,15 4,13 2,9z"/>
                  <path android:fillColor="#1A0A02"
                      android:pathData="M12,4.8m-2.2,0a2.2,2.2 0 1 1 4.4,0a2.2,2.2 0 1 1 -4.4,0"/>
              </group>
          </vector>
          EOF_FALCON_6

          cat > app/src/main/java/com/example/mtabug/MainActivity.kt << 'EOF_FALCON_7'
          package com.example.mtabug

          import android.content.Context
          import android.os.Build
          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.animation.AnimatedVisibility
          import androidx.compose.animation.core.LinearEasing
          import androidx.compose.animation.core.RepeatMode
          import androidx.compose.animation.core.animateFloat
          import androidx.compose.animation.core.infiniteRepeatable
          import androidx.compose.animation.core.rememberInfiniteTransition
          import androidx.compose.animation.core.tween
          import androidx.compose.animation.expandVertically
          import androidx.compose.animation.fadeIn
          import androidx.compose.animation.fadeOut
          import androidx.compose.animation.shrinkVertically
          import androidx.compose.animation.slideInVertically
          import androidx.compose.foundation.Canvas
          import androidx.compose.foundation.background
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.rememberScrollState
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.foundation.verticalScroll
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.alpha
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.draw.drawBehind
          import androidx.compose.ui.geometry.CornerRadius
          import androidx.compose.ui.geometry.Offset
          import androidx.compose.ui.graphics.Brush
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.graphics.Path
          import androidx.compose.ui.graphics.StrokeCap
          import androidx.compose.ui.graphics.StrokeJoin
          import androidx.compose.ui.graphics.TileMode
          import androidx.compose.ui.graphics.drawscope.Stroke
          import androidx.compose.ui.graphics.graphicsLayer
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.platform.LocalLayoutDirection
          import androidx.compose.ui.text.TextStyle
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.LayoutDirection
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import kotlin.math.sin
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.launch
          import kotlinx.coroutines.withContext
          import org.json.JSONArray
          import org.json.JSONObject
          import java.net.HttpURLConnection
          import java.net.URL

          private const val DEFAULT_WEBHOOK_URL = ""
          private const val COOLDOWN_MS = 60_000L
          private val CATEGORIES = listOf("گیم‌پلی", "اسکریپت", "وسیله نقلیه", "مپ / آبجکت", "چیت / هک", "سایر")

          private val Bg = Color(0xFF0C0806)
          private val CardBg = Color(0xE617100D)
          private val Ember = Color(0xFFFF5A1F)
          private val Orange = Color(0xFFFF8A1F)
          private val Yellow = Color(0xFFFFC14D)
          private val TextMain = Color(0xFFF6EDE7)
          private val Muted = Color(0xFFB7A79D)
          private val OnFire = Color(0xFF1A0A02)

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent {
                      MaterialTheme(
                          colorScheme = darkColorScheme(
                              primary = Orange, onPrimary = OnFire, background = Bg, surface = Bg,
                              onSurface = TextMain, onSurfaceVariant = Muted, outline = Color(0xFF4A362C)
                          )
                      ) {
                          CompositionLocalProvider(LocalLayoutDirection provides LayoutDirection.Rtl) {
                              Surface(Modifier.fillMaxSize(), color = Bg) {
                                  Box(Modifier.fillMaxSize()) {
                                      FireVeins(Modifier.fillMaxSize())
                                      TicketScreen()
                                  }
                              }
                          }
                      }
                  }
              }
          }

          @Composable
          private fun rememberFireShift(): State<Float> {
              val t = rememberInfiniteTransition(label = "fire")
              return t.animateFloat(0f, 1f, infiniteRepeatable(tween(3500, easing = LinearEasing)), label = "shift")
          }

          private fun fireBrush(shift: Float) = Brush.horizontalGradient(
              listOf(Ember, Orange, Yellow, Orange, Ember),
              startX = shift * 900f, endX = shift * 900f + 900f, tileMode = TileMode.Repeated
          )

          @Composable
          private fun FireVeins(modifier: Modifier = Modifier) {
              val t = rememberInfiniteTransition(label = "veins")
              val phase = t.animateFloat(0f, 6.2831855f, infiniteRepeatable(tween(10000, easing = LinearEasing)), label = "phase")
              val rise = t.animateFloat(0f, 1f, infiniteRepeatable(tween(8000, easing = LinearEasing)), label = "rise")
              Canvas(modifier) {
                  val p = phase.value
                  val w = size.width
                  val h = size.height
                  val veins = listOf(0.12f to 0.0f, 0.38f to 1.7f, 0.64f to 3.1f, 0.9f to 4.6f)
                  for ((x0, off) in veins) {
                      val path = Path()
                      val steps = 36
                      for (s in 0..steps) {
                          val f = s.toFloat() / steps
                          val x = w * x0 + sin(p + off + f * 5f) * w * 0.07f + sin(p * 2f + off + f * 11f) * w * 0.02f
                          val y = h * f
                          if (s == 0) path.moveTo(x, y) else path.lineTo(x, y)
                      }
                      val flick = 0.65f + 0.35f * sin(p * 3f + off * 2f)
                      drawPath(path, Color(0xFFD93A12).copy(alpha = 0.07f * flick),
                          style = Stroke(width = 28.dp.toPx(), cap = StrokeCap.Round, join = StrokeJoin.Round))
                      drawPath(path, Color(0xFFFF6A1F).copy(alpha = 0.14f * flick),
                          style = Stroke(width = 9.dp.toPx(), cap = StrokeCap.Round, join = StrokeJoin.Round))
                      drawPath(path, Color(0xFFFFC14D).copy(alpha = 0.40f * flick),
                          style = Stroke(width = 1.5.dp.toPx(), cap = StrokeCap.Round, join = StrokeJoin.Round))
                  }
                  for (i in 0 until 16) {
                      val seed = (i * 0.61803f) % 1f
                      val prog = (rise.value + seed) % 1f
                      val x = w * ((i * 0.37f + 0.11f) % 1f) + sin(p + i) * 14.dp.toPx()
                      val y = h * (1f - prog)
                      drawCircle(
                          Color(0xFFFFB347).copy(alpha = (1f - prog) * 0.75f),
                          radius = (1f + (i % 3)).dp.toPx(), center = Offset(x, y)
                      )
                  }
              }
          }

          @Composable
          private fun Reveal(visible: Boolean, delay: Int, content: @Composable () -> Unit) {
              AnimatedVisibility(
                  visible,
                  enter = fadeIn(tween(600, delay)) + slideInVertically(tween(600, delay)) { it / 6 }
              ) { content() }
          }

          @Composable
          private fun fieldColors() = OutlinedTextFieldDefaults.colors(
              focusedBorderColor = Orange, unfocusedBorderColor = Color(0xFF3A2A22),
              focusedLabelColor = Orange, unfocusedLabelColor = Muted, cursorColor = Orange,
              focusedContainerColor = Color(0x1AFFFFFF), unfocusedContainerColor = Color(0x0DFFFFFF)
          )

          @OptIn(ExperimentalLayoutApi::class)
          @Composable
          fun TicketScreen() {
              var nick by remember { mutableStateOf("") }
              var title by remember { mutableStateOf("") }
              var desc by remember { mutableStateOf("") }
              var category by remember { mutableStateOf(CATEGORIES[2]) }
              var sending by remember { mutableStateOf(false) }
              var status by remember { mutableStateOf("") }
              var statusOk by remember { mutableStateOf(true) }
              var lastSent by remember { mutableLongStateOf(0L) }
              var shown by remember { mutableStateOf(false) }
              val scope = rememberCoroutineScope()
              val ctx = LocalContext.current
              val prefs = remember { ctx.getSharedPreferences("falcon_bug", Context.MODE_PRIVATE) }
              var webhook by remember { mutableStateOf(prefs.getString("webhook", DEFAULT_WEBHOOK_URL) ?: DEFAULT_WEBHOOK_URL) }
              var showSettings by remember { mutableStateOf(webhook.isBlank()) }
              val shift = rememberFireShift()
              val pulse = rememberInfiniteTransition(label = "pulse")
                  .animateFloat(1f, 1.08f, infiniteRepeatable(tween(1400, easing = LinearEasing), RepeatMode.Reverse), label = "p")
              LaunchedEffect(Unit) { shown = true }

              Column(
                  Modifier.fillMaxSize().systemBarsPadding().imePadding()
                      .verticalScroll(rememberScrollState()).padding(20.dp),
                  verticalArrangement = Arrangement.spacedBy(18.dp)
              ) {
                  Reveal(shown, 0) {
                      Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween, verticalAlignment = Alignment.CenterVertically) {
                          Row(verticalAlignment = Alignment.CenterVertically) {
                              Box(
                                  Modifier.size(56.dp)
                                      .graphicsLayer { scaleX = pulse.value; scaleY = pulse.value }
                                      .drawBehind {
                                          drawCircle(
                                              Brush.radialGradient(
                                                  listOf(Orange.copy(alpha = 0.55f), Color.Transparent),
                                                  center = Offset(size.width / 2f, size.height / 2f),
                                                  radius = size.minDimension * 0.95f
                                              ),
                                              radius = size.minDimension * 0.95f
                                          )
                                      }
                                      .clip(RoundedCornerShape(18.dp))
                                      .background(Brush.linearGradient(listOf(Ember, Yellow))),
                                  contentAlignment = Alignment.Center
                              ) { Text("🦅", fontSize = 28.sp) }
                              Spacer(Modifier.width(14.dp))
                              Column {
                                  Text(
                                      "باگ سرور فالکن",
                                      style = TextStyle(
                                          brush = Brush.horizontalGradient(listOf(Yellow, Orange, Ember)),
                                          fontSize = 23.sp, fontWeight = FontWeight.ExtraBold
                                      )
                                  )
                                  Text("باگی دیدی؟ گزارشش کن، ما می‌سوزونیمش 🔥", fontSize = 13.sp, color = Muted)
                              }
                          }
                          IconButton(onClick = { showSettings = !showSettings }) { Text("⚙", fontSize = 22.sp, color = Muted) }
                      }
                  }

                  AnimatedVisibility(showSettings, enter = fadeIn() + expandVertically(), exit = fadeOut() + shrinkVertically()) {
                      OutlinedTextField(
                          webhook, { webhook = it.trim(); prefs.edit().putString("webhook", webhook).apply() },
                          label = { Text("آدرس وبهوک دیسکورد (تنظیم تیم)") }, singleLine = true,
                          shape = RoundedCornerShape(14.dp), colors = fieldColors(), modifier = Modifier.fillMaxWidth()
                      )
                  }

                  Reveal(shown, 120) {
                      Column(
                          Modifier.fillMaxWidth().clip(RoundedCornerShape(24.dp)).background(CardBg)
                              .drawBehind {
                                  drawRoundRect(
                                      brush = fireBrush(shift.value), cornerRadius = CornerRadius(24.dp.toPx()),
                                      style = Stroke(3.dp.toPx()), alpha = 0.9f
                                  )
                              }
                              .padding(16.dp),
                          verticalArrangement = Arrangement.spacedBy(14.dp)
                      ) {
                          OutlinedTextField(
                              nick, { nick = it }, label = { Text("نیک‌نیم داخل بازی") }, singleLine = true,
                              shape = RoundedCornerShape(14.dp), colors = fieldColors(), modifier = Modifier.fillMaxWidth()
                          )

                          Text("دسته‌بندی", fontSize = 13.sp, color = Muted)
                          FlowRow(horizontalArrangement = Arrangement.spacedBy(8.dp), verticalArrangement = Arrangement.spacedBy(8.dp)) {
                              CATEGORIES.forEach { c ->
                                  FilterChip(
                                      selected = category == c, onClick = { category = c }, label = { Text(c) },
                                      shape = RoundedCornerShape(14.dp),
                                      colors = FilterChipDefaults.filterChipColors(
                                          containerColor = Color(0x14FFFFFF), labelColor = TextMain,
                                          selectedContainerColor = Orange, selectedLabelColor = OnFire
                                      )
                                  )
                              }
    
